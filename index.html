<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SandVoc">
<meta name="description" content="SandVoc — personal English vocabulary tracker with auto dictionary lookup, spaced repetition and progress analytics.">
<title>SandVoc — English Vocabulary Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235b8def'/><text y='70' x='50' text-anchor='middle' font-size='58' font-family='system-ui' font-weight='800' fill='white'>S</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1017;--panel:#121721;--card:#161c28;--card2:#1d2534;
  --bd:#242d3d;--bd2:#2f3a4d;
  --tx:#e7ecf5;--tx2:#94a2b8;--tx3:#63718a;
  --ac:#5b8def;--ok:#2ecc71;--warn:#f2a33c;--bad:#ef5350;
  --pur:#a78bfa;--teal:#2dd4bf;
  --r:14px;--sh:0 8px 28px rgba(0,0,0,.4);--fs:15px;
}
[data-theme="light"]{
  --bg:#f3f5fa;--panel:#fff;--card:#fff;--card2:#f2f5fb;
  --bd:#e2e7f0;--bd2:#d3dae6;
  --tx:#131a26;--tx2:#5a6579;--tx3:#8b95a8;
  --sh:0 8px 24px rgba(20,30,60,.1);
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-size:var(--fs);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[data-theme="dark"] body{background:
  radial-gradient(1200px 600px at 80% -10%,#1a2438 0,transparent 60%),
  radial-gradient(900px 500px at -10% 110%,#16202f 0,transparent 60%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px;border:3px solid transparent;background-clip:content-box}

#app{display:flex;min-height:100vh}
.sidebar{width:250px;flex:0 0 250px;background:var(--panel);border-right:1px solid var(--bd);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px;
  display:flex;flex-direction:column;gap:3px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 18px}
.brand .logo{width:36px;height:36px;flex:0 0 36px;border-radius:11px;
  background:linear-gradient(135deg,var(--ac),var(--pur));display:grid;place-items:center;
  font-weight:800;color:#fff;font-size:17px}
.brand h1{font-size:15.5px;font-weight:750;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;color:var(--tx3);font-weight:500}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;
  color:var(--tx2);font-size:13.5px;font-weight:550;border:none;background:none;width:100%;
  text-align:left;transition:background .14s,color .14s}
.nav-item:hover{background:var(--card2);color:var(--tx)}
.nav-item.on{background:linear-gradient(90deg,rgba(91,141,239,.22),transparent);color:var(--tx)}
.nav-item.on .ico{color:var(--ac)}
.nav-item .ico{width:20px;text-align:center;font-size:15px;flex:0 0 20px}
.nav-item .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;
  font-weight:700;padding:1px 7px;border-radius:20px}
.side-foot{margin-top:auto;padding:12px 10px 4px;font-size:11px;color:var(--tx3);border-top:1px solid var(--bd)}

.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:1400px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar h2{font-size:22px;font-weight:750;letter-spacing:-.4px}
.topbar .sub{font-size:12.5px;color:var(--tx3);font-weight:500}
.spacer{flex:1}
.bnav{display:none}

@media(max-width:920px){
  .sidebar{display:none}
  .main{padding:14px 13px 96px}
  .topbar h2{font-size:19px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);
    border-top:1px solid var(--bd);z-index:60;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
    box-shadow:0 -6px 24px rgba(0,0,0,.22)}
  .bnav button{flex:1;background:none;border:none;display:flex;flex-direction:column;
    align-items:center;gap:2px;padding:6px 2px;color:var(--tx3);font-size:10px;
    font-weight:600;border-radius:10px;cursor:pointer;position:relative}
  .bnav button .ico{font-size:18px;line-height:1}
  .bnav button.on{color:var(--ac)}
  .bnav button .badge{position:absolute;top:0;right:calc(50% - 20px);background:var(--bad);
    color:#fff;font-size:9px;padding:0 5px;border-radius:10px;font-weight:800}
}

.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}

h3.sec{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:var(--tx3);margin:22px 0 10px}
h3.sec:first-child{margin-top:0}

.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 15px}
.stat .k{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.6px;
  color:var(--tx3);margin-bottom:6px}
.stat .v{font-size:26px;font-weight:780;letter-spacing:-1px;line-height:1.1}
.stat .v small{font-size:13px;font-weight:600;color:var(--tx3)}
.stat .d{font-size:11.5px;color:var(--tx3);margin-top:3px}
.stat.accent{border-color:rgba(91,141,239,.4)}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
.stat.warn .v{color:var(--warn)} .stat.pur .v{color:var(--pur)}

.bar{height:9px;background:var(--card2);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--ac),var(--pur));transition:width .5s cubic-bezier(.3,1,.4,1)}
.bar.ok>i{background:linear-gradient(90deg,#2ecc71,#2dd4bf)}
.bar.warn>i{background:linear-gradient(90deg,#f2a33c,#ef5350)}
.bar.thin{height:6px}
.bar-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);
  margin-bottom:6px;font-weight:550}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--ac);color:#fff;border:1px solid transparent;border-radius:10px;
  padding:10px 16px;font-size:13.5px;font-weight:650;cursor:pointer;min-height:42px;
  transition:filter .14s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.975)}
.btn.ghost{background:var(--card2);color:var(--tx);border-color:var(--bd)}
.btn.ghost:hover{background:var(--bd)}
.btn.ok{background:var(--ok);color:#04240f}
.btn.warn{background:var(--warn);color:#2a1700}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:34px;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:11.5px;min-height:28px;border-radius:7px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.inp,select.inp,textarea.inp{width:100%;background:var(--card2);border:1px solid var(--bd);
  border-radius:10px;padding:10px 12px;font-size:14px;min-height:42px;
  transition:border-color .14s,background .14s}
.inp:focus{border-color:var(--ac);outline:none;background:var(--card)}
textarea.inp{min-height:74px;resize:vertical;line-height:1.55}
label.lbl{display:block;font-size:11.5px;font-weight:650;text-transform:uppercase;
  letter-spacing:.5px;color:var(--tx3);margin:12px 0 5px}
.hint{font-size:11.5px;color:var(--tx3);margin-top:4px;line-height:1.45}

.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--bd);
  color:var(--tx2);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:600;
  cursor:pointer;transition:all .13s;user-select:none}
.chip:hover{border-color:var(--bd2);color:var(--tx)}
.chip.on{background:rgba(91,141,239,.22);border-color:var(--ac);color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;
  font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.t-A1{background:#1f4d3a;color:#7ff0bb} .t-A2{background:#1d4a52;color:#7fe4f0}
.t-B1{background:#2b3f6b;color:#9dc0ff} .t-B2{background:#3d3068;color:#c4b0ff}
.t-C1{background:#5a2f52;color:#ffb0e8} .t-C2{background:#5c3220;color:#ffbb92}
[data-theme="light"] .t-A1{background:#d6f7e6;color:#0c6b42}
[data-theme="light"] .t-A2{background:#d4f2f8;color:#0a6273}
[data-theme="light"] .t-B1{background:#dbe7ff;color:#1c4bb8}
[data-theme="light"] .t-B2{background:#e8e0ff;color:#5733c4}
[data-theme="light"] .t-C1{background:#ffe0f4;color:#a3257e}
[data-theme="light"] .t-C2{background:#ffe5d6;color:#a34a17}

.st{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.st-New{background:#20304a;color:#8fb4ee}
.st-Learning{background:#4a3a1c;color:#f2c86b}
.st-Familiar{background:#1c3f4a;color:#7fd8ee}
.st-Strong{background:#1e4433;color:#79e2a8}
.st-Mastered{background:#3a2a55;color:#c3aaff}
[data-theme="light"] .st-New{background:#e2ebfb;color:#2a5cb8}
[data-theme="light"] .st-Learning{background:#fdf0d5;color:#8a5c00}
[data-theme="light"] .st-Familiar{background:#dcf3fa;color:#0d6070}
[data-theme="light"] .st-Strong{background:#dcf7e8;color:#0b6b3e}
[data-theme="light"] .st-Mastered{background:#ece4ff;color:#5b32c9}

.wcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
  padding:15px 16px;transition:border-color .15s}
.wcard:hover{border-color:var(--bd2)}
.wcard .head{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.wcard .w{font-size:19px;font-weight:750;letter-spacing:-.4px}
.wcard .pron{font-size:12.5px;color:var(--tx3);font-weight:500}
.wcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.mline{display:flex;gap:9px;font-size:13px;margin-top:8px;line-height:1.55}
.mline .n{color:var(--tx3);font-weight:700;font-size:11.5px;min-width:14px;padding-top:1px}
.mline .t{flex:1;color:var(--tx2)}
.mline .t b{color:var(--tx);font-weight:600}
.ex{font-style:italic;color:var(--tx2);border-left:2px solid var(--bd2);
  padding-left:10px;margin-top:8px;font-size:13px}
.coll{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.coll span{background:rgba(45,212,191,.16);border:1px solid rgba(45,212,191,.35);
  color:var(--teal);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:600}
[data-theme="light"] .coll span{color:#0b7a6d}
.syn span{background:rgba(167,139,250,.16);border-color:rgba(167,139,250,.35);color:var(--pur)}
[data-theme="light"] .syn span{color:#5b32c9}
.ant span{background:rgba(239,83,80,.16);border-color:rgba(239,83,80,.35);color:var(--bad)}
[data-theme="light"] .ant span{color:#b3241f}

.overlay{position:fixed;inset:0;background:rgba(4,7,13,.72);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--bd);border-radius:18px;width:100%;
  max-width:780px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh);
  animation:pop .2s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal.sm{max-width:440px}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--bd)}
.modal-head h3{font-size:16.5px;font-weight:730;flex:1;letter-spacing:-.2px}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.modal-foot{padding:13px 18px;border-top:1px solid var(--bd);display:flex;gap:9px;
  justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:none;color:var(--tx3);font-size:22px;cursor:pointer;
  line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{background:var(--card2);color:var(--tx)}

#toastRoot{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
  width:min(92vw,440px)}
.toast{background:var(--card2);border:1px solid var(--bd2);color:var(--tx);
  padding:11px 16px;border-radius:11px;font-size:13.5px;font-weight:600;
  box-shadow:var(--sh);animation:tin .22s ease;width:100%;text-align:center}
.toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}
.toast.warn{border-color:var(--warn)}
@keyframes tin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:920px){#toastRoot{bottom:86px}}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--tx3);
  text-transform:uppercase;letter-spacing:.5px;padding-bottom:2px}
.cday{aspect-ratio:1;border-radius:10px;background:var(--card2);border:1px solid transparent;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;font-size:12.5px;font-weight:600;transition:transform .12s,border-color .12s;
  position:relative;padding:2px;min-height:44px}
.cday:hover{transform:scale(1.06);border-color:var(--bd2)}
.cday.empty{background:transparent;cursor:default;pointer-events:none}
.cday .p{font-size:8.5px;opacity:.85;font-weight:700;line-height:1}
.cday.done{background:linear-gradient(160deg,rgba(46,204,113,.35),rgba(45,212,191,.2));
  border-color:rgba(46,204,113,.4)}
.cday.part{background:linear-gradient(160deg,rgba(242,163,60,.28),rgba(239,83,80,.14));
  border-color:rgba(242,163,60,.4)}
.cday.skip{background:repeating-linear-gradient(45deg,rgba(239,83,80,.14),
  rgba(239,83,80,.14) 5px,transparent 5px,transparent 10px);
  border-color:rgba(239,83,80,.35);color:var(--tx3)}
.cday.today{border-color:var(--ac);box-shadow:0 0 0 2px rgba(91,141,239,.3)}
.cday.future{opacity:.42}

.flash{background:linear-gradient(165deg,var(--card),var(--card2));border:1px solid var(--bd);
  border-radius:20px;padding:38px 24px;text-align:center;min-height:270px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.flash .w{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:-1.4px;line-height:1.1}
.flash .ipa{font-size:15px;color:var(--tx3);font-weight:500}

.qopt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--bd);
  border-radius:12px;padding:13px 16px;margin-bottom:9px;cursor:pointer;font-size:14px;
  font-weight:550;transition:all .14s;min-height:48px}
.qopt:hover{border-color:var(--ac);background:var(--card)}
.qopt.correct{border-color:var(--ok);background:rgba(46,204,113,.18)}
.qopt.wrong{border-color:var(--bad);background:rgba(239,83,80,.18)}
.qopt[disabled]{cursor:default}

.rm{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rmcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);
  padding:14px;position:relative;overflow:hidden}
.rmcard .m{font-size:11px;font-weight:750;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px}
.rmcard .lv{font-size:17px;font-weight:750;margin:3px 0 8px;letter-spacing:-.3px}
.rmcard.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.rmcard.cur::after{content:'CURRENT';position:absolute;top:10px;right:-26px;background:var(--ac);
  color:#fff;font-size:8.5px;font-weight:800;padding:2px 28px;transform:rotate(38deg);
  letter-spacing:.5px}

.row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
  background:var(--card2);border:1px solid transparent;margin-bottom:7px}
.row:hover{border-color:var(--bd2)}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:650;font-size:14px}
.row .sub{font-size:11.5px;color:var(--tx3)}

.empty{text-align:center;padding:44px 20px;color:var(--tx3)}
.empty .e{font-size:38px;margin-bottom:10px;opacity:.5}
.empty h4{font-size:16px;color:var(--tx2);font-weight:650;margin-bottom:6px}
.empty p{font-size:13px;max-width:420px;margin:0 auto 16px;line-height:1.6}

.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);
  font-size:13px;gap:12px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx3);font-weight:550}
.kv .v{font-weight:680;text-align:right}

.flexrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.mt{margin-top:14px} .mt-s{margin-top:8px} .mb{margin-bottom:14px}
.tx2{color:var(--tx2)} .tx3{color:var(--tx3)}
.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

.fetchlog{max-height:220px;overflow-y:auto;margin-top:10px;font-size:12.5px;
  border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:var(--card2)}
.fetchlog .fl{display:flex;align-items:center;gap:8px;padding:4px 0;
  border-bottom:1px solid var(--bd)}
.fetchlog .fl:last-child{border-bottom:none}
.fetchlog .ic{width:14px;flex:0 0 14px;font-weight:800}
.fetchlog .wd{font-weight:650;min-width:110px;flex:0 0 110px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.fetchlog .dt{color:var(--tx3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main"><div id="viewRoot"></div></main>
</div>
<nav class="bnav" id="bnav"></nav>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,.csv,.txt" style="display:none">

<script>
"use strict";
/* ============================================================================
   SANDVOC — English Vocabulary Learning & Tracking System
   Single-file, offline-first, publish-ready.
   ========================================================================== */

/* ---------- UTILS ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);

const localISO = (d = new Date()) => {
  const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return z.toISOString().slice(0, 10);
};
const todayISO = () => localISO();
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return localISO(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const prettyDate = iso => iso ? parseISO(iso).toLocaleDateString(undefined,
  { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }) : '—';
const shortDate = iso => iso ? parseISO(iso).toLocaleDateString(undefined,
  { month: 'short', day: 'numeric' }) : '—';
const startOfWeekISO = iso => {
  const d = parseISO(iso), dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow); return localISO(d);
};
const monthKey = iso => iso.slice(0, 7);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pct = (a, b) => b > 0 ? (a / b) * 100 : 0;
const fmtPct = (n, d = 1) => (Math.round(n * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d) + '%';
const num = n => (n ?? 0).toLocaleString();
const splitList = v => Array.isArray(v)
  ? v.map(x => String(x).trim()).filter(Boolean)

/* ---------- STORAGE ---------- */
const DB_NAME = 'sandvoc_db';
const DB_VERSION = 1;
const DB = (() => {
  let idb = null, useFallback = false;
  const LS_KEY = 'sandvoc_fallback_v1';
  const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch { return {}; } };
  const lsWrite = o => { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) { console.warn('LS full', e); } };
  const lsStore = name => {
    const all = lsRead(); if (!all[name]) all[name] = {};
    return {
      get: k => all[name][k],
      put: v => { all[name][v.id ?? v.key ?? v.date] = v; lsWrite(all); },
      all: () => Object.values(all[name]),
      del: k => { delete all[name][k]; lsWrite(all); },
      clear: () => { all[name] = {}; lsWrite(all); }
    };
  };
  async function open() {
    if (idb || useFallback) return;
    if (!('indexedDB' in window)) { useFallback = true; return; }
    try {
      idb = await new Promise((res, rej) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('words')) d.createObjectStore('words', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('days')) d.createObjectStore('days', { keyPath: 'date' });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
          if (!d.objectStoreNames.contains('quizzes')) d.createObjectStore('quizzes', { keyPath: 'id' });
        };
        req.onsuccess = e => res(e.target.result);
        req.onerror = e => rej(e.target.error);
      });
    } catch (e) { console.warn('IDB failed', e); useFallback = true; }
  }
  return {
    init: async () => { await open(); },
    get fallback() { return useFallback; },
    async getAll(store) {
      if (useFallback) return lsStore(store).all();
      return new Promise((res, rej) => {
        const t = idb.transaction(store, 'readonly');
        const r = t.objectStore(store).getAll();
        r.onsuccess = () => res(r.result || []);
        r.onerror = () => rej(r.error);
      });
    },
    async put(store, val) {
      if (useFallback) { lsStore(store).put(val); return val; }
      return new Promise((res, rej) => {
        const t = idb.transaction(store, 'readwrite');
        t.objectStore(store).put(val);
        t.oncomplete = () => res(val);
        t.onerror = () => rej(t.error);
      });
    },
    async bulkPut(store, arr) {
      if (useFallback) { arr.forEach(v => lsStore(store).put(v)); return arr.length; }
      return new Promise((res, rej) => {
        const t = idb.transaction(store, 'readwrite');
        const s = t.objectStore(store);
        arr.forEach(v => s.put(v));
        t.oncomplete = () => res(arr.length);
        t.onerror = () => rej(t.error);
      });
    },
    async del(store, key) {
      if (useFallback) { lsStore(store).del(key); return; }
      return new Promise((res, rej) => {
        const t = idb.transaction(store, 'readwrite');
        t.objectStore(store).delete(key);
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
      });
    },
    async clear(store) {
      if (useFallback) { lsStore(store).clear(); return; }
      return new Promise((res, rej) => {
        const t = idb.transaction(store, 'readwrite');
        t.objectStore(store).clear();
        t.oncomplete = () => res();
        t.onerror = () => rej(t.error);
      });
    }
  };
})();

function buildIndexes() {
  const added = {}, reviewed = {}, activeSet = new Set();
  for (const w of State.words) {
    added[w.dateAdded] = (added[w.dateAdded] || 0) + 1;
    activeSet.add(w.dateAdded);
    for (const h of (w.history || [])) {
      reviewed[h.d] = (reviewed[h.d] || 0) + 1;
      activeSet.add(h.d);
    }
  }
  for (const d of Object.values(State.days)) if (d.skipped) activeSet.delete(d.date);
  IDX.addedByDate = added;
  IDX.reviewedByDate = reviewed;
  IDX.activeDates = [...activeSet].sort();
  const map = {};
  IDX.activeDates.forEach((d, i) => { map[d] = i + 1; });
  IDX.dateToLearnDay = map;
}
function learningDay(date) {
  const day = State.days[date];
  if (day?.skipped) return null;
  if (IDX.dateToLearnDay[date]) return IDX.dateToLearnDay[date];
  let c = 0;
  for (const d of IDX.activeDates) { if (d < date) c++; else break; }
  return c + 1;
}
const weekNumberOf = date => Math.max(1, Math.floor(daysBetween(State.settings.programStart, date) / 7) + 1);
const monthNumberOf = date => {
  const s = parseISO(State.settings.programStart), d = parseISO(date);
  return Math.max(1, (d.getFullYear() - s.getFullYear()) * 12 + (d.getMonth() - s.getMonth()) + 1);
};

/* ---------- DICTIONARY API ---------- */
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) =>
  setTimeout(() => rej(new Error('timeout')), ms))]);

async function fetchDictionary(word) {
  try {
    const r = await withTimeout(
      fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word)),
      8000
    );
    if (!r.ok) return null;
    const j = await r.json();
    if (!Array.isArray(j) || !j[0]) return null;
    const entry = j[0];
    const meanings = [], examples = [], synonyms = [], antonyms = [];
    let pos = '';
    (entry.meanings || []).slice(0, 5).forEach(m => {
      if (!pos) pos = m.partOfSpeech || '';
      (m.definitions || []).slice(0, 3).forEach(d => {
        if (d.definition) meanings.push(d.definition);
        if (d.example) examples.push(d.example);
      });
      (m.synonyms || []).slice(0, 6).forEach(s => synonyms.push(s));
      (m.antonyms || []).slice(0, 6).forEach(a => antonyms.push(a));
    });
    let ipa = '';
    (entry.phonetics || []).forEach(p => { if (p.text && !ipa) ipa = p.text; });
    if (!ipa && entry.phonetic) ipa = entry.phonetic;
    return {
      pos: pos || 'noun',
      meanings: [...new Set(meanings)].slice(0, 4),
      example: examples[0] || '',
      synonyms: [...new Set(synonyms)].slice(0, 6),
      antonyms: [...new Set(antonyms)].slice(0, 6),
      ipa: ipa || ''
    };
  } catch (e) { return null; }
}

/* ---------- STATS ---------- */
const liveWords = () => State.words.filter(w => !w.deleted);
function isWeak(w) {
  if (!w.history?.length) return false;
  const fails = w.failCount || 0;
  const step = w.srs?.step ?? 0;
  if (fails >= 3 && step < 4) return true;
  if (fails >= 2 && step < 3) return true;
  if ((w.confidence || 3) <= 2 && fails >= 1) return true;
  return false;
}
const isStrong = w => (w.srs?.step ?? 0) >= 4 && (w.confidence || 3) >= 4 && !isWeak(w);
function statusOf(w) {
  if (w.statusLocked && w.status) return w.status;
  const step = w.srs?.step ?? 0, conf = w.confidence || 3;
  if (step >= 5 && conf >= 4) return 'Mastered';
  if (step >= 4) return 'Strong';
  if (step >= 2) return 'Familiar';
  if (step >= 1 || (w.history || []).length) return 'Learning';
  return 'New';
}
const dueWords = (date = todayISO()) =>
  liveWords().filter(w => w.srs?.nextReview && w.srs.nextReview <= date);

const Stats = {
  total: () => liveWords().length,
  byLevel() {
    const o = {}; LEVELS.forEach(l => o[l] = 0);
    liveWords().forEach(w => { if (o[w.level] !== undefined) o[w.level]++; });
    return o;
  },
  byStatus() {
    const o = {}; STATUSES.forEach(s => o[s] = 0);
    liveWords().forEach(w => o[statusOf(w)]++);
    return o;
  },
  families() {
    const s = new Set();
    liveWords().forEach(w => s.add(w.wordLower));
    return s.size;
  },
  weak: () => liveWords().filter(isWeak),
  strong: () => liveWords().filter(isStrong),
  mastered: () => liveWords().filter(w => statusOf(w) === 'Mastered'),
  active: () => liveWords().filter(w => w.active).length,
  passive: () => liveWords().filter(w => w.passive).length,
  addedOn: d => IDX.addedByDate[d] || 0,
  reviewedOn: d => IDX.reviewedByDate[d] || 0,
  rangeAdded(from, to) { let n = 0; for (let d = from; d <= to; d = addDays(d, 1)) n += IDX.addedByDate[d] || 0; return n; },
  rangeReviewed(from, to) { let n = 0; for (let d = from; d <= to; d = addDays(d, 1)) n += IDX.reviewedByDate[d] || 0; return n; },
  studyDays: () => IDX.activeDates.length,
  skippedDays: () => Object.values(State.days).filter(d => d.skipped).length,
  daysElapsed: () => Math.max(0, daysBetween(State.settings.programStart, todayISO())) + 1,
  currentStreak() {
    let streak = 0, d = todayISO();
    if (!(IDX.addedByDate[d] || IDX.reviewedByDate[d])) d = addDays(d, -1);
    while (true) {
      if (State.days[d]?.skipped) break;
      if (!(IDX.addedByDate[d] || IDX.reviewedByDate[d])) break;
      streak++;
      d = addDays(d, -1);
      if (daysBetween(State.settings.programStart, d) < -400) break;
    }
    return streak;
  },
  longestStreak() {
    const dates = [...new Set([...Object.keys(IDX.addedByDate), ...Object.keys(IDX.reviewedByDate)])]
      .filter(d => !State.days[d]?.skipped).sort();
    let best = 0, cur = 0, prev = null;
    for (const d of dates) {
      if (prev && daysBetween(prev, d) === 1) cur++; else cur = 1;
      best = Math.max(best, cur);
      prev = d;
    }
    return best;
  },
  avgPerStudyDay() { const s = this.studyDays(); return s ? this.total() / s : 0; },
  avgPerCalendarDay() { const d = this.daysElapsed(); return d ? this.total() / d : 0; },
  quizAccuracy() {
    if (!State.quizzes.length) return null;
    const t = State.quizzes.reduce((a, q) => a + q.total, 0);
    const c = State.quizzes.reduce((a, q) => a + q.correct, 0);
    return t ? (c / t) * 100 : null;
  },
  completionRate() {
    const t = this.daysElapsed() * State.settings.dailyTarget;
    return t ? clamp((this.total() / t) * 100, 0, 100) : 0;
  },
  dueToday: () => dueWords().length
};

/* ---------- UI PRIMITIVES ---------- */
function toast(msg, kind = '', ms = 2400) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toastRoot').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 320);
  }, ms);
}
function openModal({ title, body, footer = '', small = false, onMount }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal ${small ? 'sm' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="x" data-close aria-label="Close">×</button></div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-foot">${footer}</div>` : ''}
    </div>`;
  $('#modalRoot').appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-close]')) close(); });
  const onKey = e => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  if (onMount) onMount(ov, close);
  return { el: ov, close };
}
function confirmModal(title, msg, onYes, yesLabel = 'Confirm', danger = true) {
  openModal({
    title, small: true,
    body: `<p style="font-size:14px;line-height:1.65;color:var(--tx2)">${msg}</p>`,
    footer: `<button class="btn ghost" data-close>Cancel</button>
             <button class="btn ${danger ? 'bad' : ''}" id="cfmYes">${esc(yesLabel)}</button>`,
    onMount(el, close) { $('#cfmYes', el).onclick = () => { close(); onYes(); }; }
  });
}
let speechOk = 'speechSynthesis' in window;
function speak(text, rate = 0.92) {
  if (!speechOk) { toast('Speech not supported in this browser', 'warn'); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'en-US'; u.rate = rate; u.pitch = 1;
    const voices = window.speechSynthesis.getVoices();
    const en = voices.find(v => /en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang));
    if (en) u.voice = en;
    window.speechSynthesis.speak(u);
  } catch (e) { console.warn(e); }
}
if (speechOk) { try { window.speechSynthesis.getVoices(); } catch { } }

function dayStatusLabel(date) {
  const d = getDay(date);
  if (d.skipped) return 'Skipped';
  const added = Stats.addedOn(date), target = State.settings.dailyTarget;
  if (added === 0 && date < todayISO()) return 'Missed';
  if (added === 0) return 'Not Started';
  if (added >= target) return 'Completed';
  if (added >= target * 0.5) return 'Partially Completed';
  return 'In Progress';
}

Views.add.bind = () => {
  const qi = $('#quickInput');
  const statusEl = $('#quickStatus');

  const doQuick = async () => {
    const raw = qi.value.trim();
    if (!raw) return;
    const w = raw.replace(/[^A-Za-z' -]/g, '').trim();
    if (!w) { toast('Please enter a valid English word', 'bad'); return; }
    const lower = w.toLowerCase();
    if (liveWords().some(x => x.wordLower === lower)) {
      toast(`"${w}" already exists`, 'warn');
      qi.value = '';
      return;
    }
    qi.value = '';
    qi.disabled = true;
    if (State.settings.autoFetch && navigator.onLine) {
      statusEl.innerHTML = '<span class="spin"></span> Looking up definition…';
    } else {
      statusEl.textContent = 'Saving…';
    }
    const r = await addWordQuick(w, todayISO());
    qi.disabled = false;
    statusEl.textContent = '';
    qi.focus();
    render(); renderNav();
  };
  $('#quickBtn').onclick = doQuick;
  qi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doQuick(); } });

  $('#quickFetchMode').onclick = async () => {
    State.settings.autoFetch = !State.settings.autoFetch;
    await saveSettings();
    render();
  };

  /* Bulk mode */
  let bulkMode = 'offline';
  const modeOff = $('#bulkModeOffline'), modeOn = $('#bulkModeOnline'), modeHint = $('#bulkModeHint');
  modeOff.onclick = () => {
    bulkMode = 'offline';
    modeOff.classList.add('on'); modeOn.classList.remove('on');
    modeHint.textContent = 'Words save instantly without meaning data. Fastest option, works offline.';
  };
  modeOn.onclick = () => {
    bulkMode = 'online';
    modeOn.classList.add('on'); modeOff.classList.remove('on');
    modeHint.innerHTML = 'Each word is looked up on <b>dictionaryapi.dev</b> — meaning, part of speech, IPA, example, synonyms and antonyms are filled automatically. Live log below.';
  };

  $('#bulkBtn').onclick = async () => {
    const raw = $('#bulkText').value;
    const list = raw.split(/[\n,;]+/).flatMap(l => l.trim().split(/\s+/))
      .map(s => s.replace(/[^A-Za-z' -]/g, '').trim()).filter(Boolean);
    if (!list.length) { toast('Nothing to add', 'bad'); return; }

    const level = $('#bulkLevel').value;
    const cat = $('#bulkCat').value;
    const date = $('#bulkDate').value || todayISO();

    const seen = new Set();
    const unique = list.filter(w => {
      const k = w.toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });
    const existing = new Set(liveWords().map(w => w.wordLower));
    const fresh = unique.filter(w => !existing.has(w.toLowerCase()));
    const dupes = unique.length - fresh.length;

    if (!fresh.length) {
      toast(`All ${unique.length} word${unique.length === 1 ? '' : 's'} already exist`, 'warn');
      return;
    }

    if (bulkMode === 'offline') {
      let n = 0;
      for (const w of fresh) {
        await addWordQuick(w, date, { level, category: cat, silent: true, fetch: false });
        n++;
      }
      $('#bulkText').value = '';
      buildIndexes();
      toast(`Added ${n} word${n === 1 ? '' : 's'}${dupes ? `, ${dupes} skipped` : ''}`, 'ok', 3200);
      render(); renderNav();
      return;
    }

    if (!navigator.onLine) {
      toast('You are offline — switch to Offline mode', 'bad', 3200);
      return;
    }

    const prog = $('#bulkProgress'), bar = $('#bulkBar'), log = $('#bulkLog');
    const btn = $('#bulkBtn'), cancelBtn = $('#bulkCancel'), statusEl2 = $('#bulkStatus');
    prog.style.display = 'block';
    log.innerHTML = '';
    btn.disabled = true;
    cancelBtn.style.display = 'inline-flex';
    let aborted = false;
    cancelBtn.onclick = () => { aborted = true; cancelBtn.disabled = true; cancelBtn.textContent = 'Stopping…'; };

    const results = new Array(fresh.length).fill(undefined);
    let done = 0, next = 0;
    const CONCURRENCY = 4;

    const logRow = (word, state, detail) => {
      const color = state === 'ok' ? 'var(--ok)' : state === 'miss' ? 'var(--tx3)' : 'var(--bad)';
      const icon = state === 'ok' ? '✓' : state === 'miss' ? '○' : '✕';
      const row = document.createElement('div');
      row.className = 'fl';
      row.innerHTML = `<span class="ic" style="color:${color}">${icon}</span>
        <span class="wd">${esc(word)}</span>
        <span class="dt">${esc(detail || '')}</span>`;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    };

    const worker = async () => {
      while (next < fresh.length && !aborted) {
        const i = next++;
        const w = fresh[i];
        let data = null;
        try { data = await fetchDictionary(w); } catch { data = null; }
        results[i] = data;
        done++;
        bar.style.width = clamp(pct(done, fresh.length), 0, 100) + '%';
        statusEl2.textContent = `${done} / ${fresh.length}`;
        if (data && data.meanings && data.meanings.length) {
          logRow(w, 'ok', data.meanings[0].slice(0, 70));
        } else if (data) {
          logRow(w, 'ok', 'partial data');
        } else {
          logRow(w, 'miss', 'not found — saved without meaning');
        }
      }
    };

    const t0 = Date.now();
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, fresh.length) }, worker));
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);

    let saved = 0, enriched = 0;
    const missing = [];
    for (let i = 0; i < fresh.length; i++) {
      if (results[i] === undefined && aborted) { missing.push(fresh[i]); continue; }
      const w = fresh[i], d = results[i] || {};
      if (results[i]) enriched++; else missing.push(w);
      const rec = normalizeWordRecord({
        id: uid(), word: w, pos: d.pos || '', level: level || State.settings.defaultLevel,
        meanings: d.meanings || [], example: d.example || '',
        synonyms: d.synonyms || [], antonyms: d.antonyms || [],
        ipa: d.ipa || '', categories: cat ? [cat] : [],
        dateAdded: date, difficulty: 'Medium',
        srs: { step: 0, nextReview: addDays(date, 1), last: null }, history: []
      });
      await saveWord(rec, true);
      saved++;
    }

    btn.disabled = false;
    cancelBtn.style.display = 'none';
    cancelBtn.disabled = false;
    cancelBtn.textContent = 'Cancel';
    statusEl2.textContent = '';
    buildIndexes();
    toast(`Saved ${saved} word${saved === 1 ? '' : 's'} in ${elapsed}s — ${enriched} enriched` +
      (missing.length ? `, ${missing.length} not found` : '') +
      (dupes ? ` (${dupes} duplicate${dupes === 1 ? '' : 's'} skipped)` : ''), 'ok', 6000);
    render(); renderNav();

    if (missing.length) {
      setTimeout(() => {
        const ta = $('#bulkText');
        if (ta) { ta.value = missing.join('\n'); ta.focus(); }
      }, 80);
    }
  };

  $('#fullBtn').onclick = () => openWordEditor(null);
  $('#loadDemo').onclick = loadDemoData;
  $('#removeDemo').onclick = () => confirmModal('Remove demo words',
    'This deletes all words tagged as demo data. Your own words are not affected.',
    async () => { await removeDemoData(); toast('Demo words removed', 'ok'); });
};

const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

function startQuiz() {
  const types = $$('[data-qt].on').map(c => c.dataset.qt);
  if (!types.length) { toast('Select at least one question type', 'bad'); return; }
  const pool = $('#qpool').value;
  const count = parseInt($('#qcount').value, 10);
  const lvl = $('#qlevel') ? $('#qlevel').value : null;

  let src = liveWords().filter(w => (w.meanings || []).length && w.word);
  if (pool === 'weak') src = src.filter(isWeak);
  else if (pool === 'due') src = dueWords();
  else if (pool === 'recent') src = src.filter(w => w.dateAdded >= addDays(todayISO(), -30));
  else if (pool === 'level') src = src.filter(w => w.level === lvl);

  if (src.length < 4) { toast('Need at least 4 words with meanings', 'bad'); return; }

  const items = [];
  const shuffled = [...src].sort(() => Math.random() - 0.5);
  for (let n = 0; n < count * 3 && items.length < count; n++) {
    const w = shuffled[n % shuffled.length];
    const type = types[n % types.length];
    const it = makeQuestion(w, type, src);
    if (it) items.push(it);
  }
  if (!items.length) { toast('Could not generate questions', 'bad'); return; }
  State.quiz = { items, i: 0, correct: 0, total: items.length, log: [], done: false };
  render();
}
function makeQuestion(w, type, pool) {
  const meaning = (w.meanings || [])[0];
  if (!meaning) return null;
  const distract = [...pool].filter(x => x.id !== w.id).sort(() => Math.random() - 0.5);
  const pick = n => distract.slice(0, n);
  switch (type) {
    case 'word2mean': {
      const wrong = pick(3).map(x => (x.meanings || [])[0]).filter(Boolean);
      if (wrong.length < 3) return null;
      const opts = [meaning, ...wrong].sort(() => Math.random() - 0.5);
      return { wordId: w.id, word: w.word, big: true, instruction: 'What does this word mean?',
        prompt: w.word, speak: w.word, options: opts, correctIndex: opts.indexOf(meaning), answer: meaning };
    }
    case 'mean2word': {
      const wrong = pick(3).map(x => x.word);
      if (wrong.length < 3) return null;
      const opts = [w.word, ...wrong].sort(() => Math.random() - 0.5);
      return { wordId: w.id, word: w.word, big: false, instruction: 'Which word matches this meaning?',
        prompt: meaning, options: opts, correctIndex: opts.indexOf(w.word), answer: w.word };
    }
    case 'fill': {
      if (!w.example || !w.example.toLowerCase().includes(w.word.toLowerCase())) return null;
      const re = new RegExp(w.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
      const blanked = w.example.replace(re, '________');
      const wrong = pick(3).map(x => x.word);
      if (wrong.length < 3) return null;
      const opts = [w.word, ...wrong].sort(() => Math.random() - 0.5);
      return { wordId: w.id, word: w.word, big: false, instruction: 'Fill in the blank',
        prompt: blanked, options: opts, correctIndex: opts.indexOf(w.word), answer: w.word };
    }
    case 'listen': {
      const wrong = pick(3).map(x => x.word);
      if (wrong.length < 3) return null;
      const opts = [w.word, ...wrong].sort(() => Math.random() - 0.5);
      return { wordId: w.id, word: w.word, big: false, instruction: 'Listen and choose the word you hear',
        prompt: '🔊 Press play, then choose the word.', speak: w.word,
        options: opts, correctIndex: opts.indexOf(w.word), answer: w.word };
    }
    default: return null;
  }
}

Views.calendar = () => {
  const [y, m] = State.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const daysInMonth = new Date(y, m, 0).getDate();
  const startDow = (first.getDay() + 6) % 7;
  const today = todayISO();
  const target = State.settings.dailyTarget;
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += `<div class="cday empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = `${State.calMonth}-${String(d).padStart(2, '0')}`;
    const added = Stats.addedOn(iso), rev = Stats.reviewedOn(iso);
    const day = State.days[iso];
    let cls = '';
    if (day?.skipped) cls = 'skip';
    else if (added >= target) cls = 'done';
    else if (added > 0) cls = 'part';
    if (iso === today) cls += ' today';
    if (iso > today) cls += ' future';
    cells += `<button class="cday ${cls}" data-day="${iso}" title="${prettyDate(iso)}">
      <span class="n">${d}</span>
      ${added ? `<span class="p">${added}w</span>` : rev ? `<span class="p">${rev}r</span>` : ''}
    </button>`;
  }
  const sel = State.selectedDay;
  let detail = '';
  if (sel) {

Views.calendar.bind = () => {
  $$('[data-day]').forEach(b => b.onclick = () => { State.selectedDay = b.dataset.day; render(); });
  $$('[data-skip]').forEach(b => b.onclick = () => markSkipped(b.dataset.skip, true));
  $$('[data-unskip]').forEach(b => b.onclick = () => markSkipped(b.dataset.unskip, false));
  $$('[data-mv]').forEach(b => b.onclick = () => {
    const v = b.dataset.mv;
    if (v === '0') { State.calMonth = todayISO().slice(0, 7); render(); return; }
    const [y, m] = State.calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + Number(v), 1);
    State.calMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    render();
  });
};

/* --- PROGRESS --- */
Views.progress = () => {
  const today = todayISO();
  const weekStart = startOfWeekISO(today);
  const monthStart = today.slice(0, 8) + '01';
  const target = State.settings.dailyTarget;
  const wTarget = target * 7;
  const wAdded = Stats.rangeAdded(weekStart, today);
  const wRev = Stats.rangeReviewed(weekStart, today);
  const wStudy = IDX.activeDates.filter(d => d >= weekStart && d <= today).length;
  const wSkip = Object.values(State.days).filter(d => d.skipped && d.date >= weekStart && d.date <= today).length;
  const mTarget = target * 30;
  const mAdded = Stats.rangeAdded(monthStart, today);
  const mRev = Stats.rangeReviewed(monthStart, today);
  const mStudy = IDX.activeDates.filter(d => d >= monthStart && d <= today).length;
  const mSkip = Object.values(State.days).filter(d => d.skipped && d.date >= monthStart && d.date <= today).length;
  const lv = Stats.byLevel();

  const weeks = [];
  for (let i = 7; i >= 0; i--) {
    const s = addDays(weekStart, -i * 7);
    const e = addDays(s, 6);
    weeks.push({ s, n: Stats.rangeAdded(s, e > today ? today : e) });
  }
  const maxW = Math.max(1, ...weeks.map(w => w.n));

  return `
  <div class="topbar"><div><h2>Progress</h2><div class="sub">All figures computed from your actual records</div></div></div>
  <h3 class="sec">Weekly Review — Week ${weekNumberOf(today)}</h3>

    <div class="stat"><div class="k">Target</div><div class="v">${wTarget}</div></div>
    <div class="stat accent"><div class="k">Added</div><div class="v">${wAdded}</div><div class="d">${fmtPct(pct(wAdded, wTarget))} complete</div></div>
    <div class="stat"><div class="k">Reviews</div><div class="v">${wRev}</div></div>
    <div class="stat warn"><div class="k">Weak Words</div><div class="v">${liveWords().filter(w => w.dateAdded >= weekStart && isWeak(w)).length}</div></div>
  </div>
  <div class="card mt">
    <div class="bar-lbl"><span>Week ${weekNumberOf(today)} progress</span><span class="mono">${fmtPct(pct(wAdded, wTarget))}</span></div>
    <div class="bar ${pct(wAdded, wTarget) >= 100 ? 'ok' : ''}"><i style="width:${clamp(pct(wAdded, wTarget), 0, 100)}%"></i></div>
    <div class="grid g3 mt">
      <div class="kv"><span class="k">Days studied</span><span class="v">${wStudy}</span></div>
      <div class="kv"><span class="k">Days skipped</span><span class="v">${wSkip}</span></div>
      <div class="kv"><span class="k">Avg / day</span><span class="v">${(wAdded / 7).toFixed(1)}</span></div>
    </div>
  </div>
  <h3 class="sec">Monthly Review — Month ${monthNumberOf(today)}</h3>
  <div class="grid g4">
    <div class="stat"><div class="k">Monthly Target</div><div class="v">${mTarget}</div><div class="d">30 × ${target}</div></div>
    <div class="stat accent"><div class="k">Words Learned</div><div class="v">${mAdded}</div><div class="d">${fmtPct(pct(mAdded, mTarget))}</div></div>
    <div class="stat"><div class="k">Reviews</div><div class="v">${mRev}</div></div>
    <div class="stat ok"><div class="k">Study Days</div><div class="v">${mStudy}</div><div class="d">${mSkip} skipped</div></div>
  </div>
  <div class="card mt">
    <div class="kv"><span class="k">Average words / study day</span><span class="v">${(mAdded / Math.max(1, mStudy)).toFixed(1)}</span></div>
    <div class="kv"><span class="k">Completion rate</span><span class="v">${fmtPct(pct(mAdded, mTarget))}</span></div>
  </div>
  <h3 class="sec">Weekly activity (last 8 weeks)</h3>
  <div class="card">
    <div style="display:flex;align-items:flex-end;gap:8px;height:150px">
      ${weeks.map(w => `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end">
          <div style="font-size:10.5px;color:var(--tx3);font-weight:700">${w.n}</div>
          <div style="width:100%;height:${(w.n / maxW) * 100}%;min-height:3px;background:linear-gradient(180deg,var(--ac),var(--pur));border-radius:6px 6px 3px 3px"></div>
          <div style="font-size:9.5px;color:var(--tx3)">${shortDate(w.s)}</div>
        </div>`).join('')}
    </div>
  </div>

  <div class="card">
    ${LEVELS.map(l => {
      const have = lv[l], want = LEVEL_PLAN[l];
      return `<div style="margin-bottom:12px">
        <div class="bar-lbl"><span><span class="tag t-${l}">${l}</span></span>
        <span class="mono">${num(have)} / ${num(want)}</span></div>
        <div class="bar thin"><i style="width:${clamp(pct(have, want), 0, 100)}%"></i></div>
      </div>`;
    }).join('')}
  </div>
  <h3 class="sec">Complete Statistics</h3>
  <div class="card">
    ${[
      ['Total unique words', num(Stats.total())],
      ['Words learned today', num(Stats.addedOn(today))],
      ['Words learned this week', num(wAdded)],
      ['Words learned this month', num(mAdded)],
      ['Average words per study day', Stats.avgPerStudyDay().toFixed(2)],
      ['Average words per calendar day', Stats.avgPerCalendarDay().toFixed(2)],
      ['Current streak', Stats.currentStreak() + ' days'],
      ['Longest streak', Stats.longestStreak() + ' days'],

      ['Days skipped', num(Stats.skippedDays())],
      ['Calendar days elapsed', num(Stats.daysElapsed())],
      ['Completion rate', fmtPct(Stats.completionRate())],
      ['Mastered words', num(Stats.mastered().length)],
      ['Weak words', num(Stats.weak().length)],
      ['Strong words', num(Stats.strong().length)],
      ['Words due for review', num(Stats.dueToday())],
      ['Quiz accuracy', Stats.quizAccuracy() === null ? '—' : Stats.quizAccuracy().toFixed(1) + '%'],
      ['Active vocabulary', num(Stats.active())],
      ['Passive vocabulary', num(Stats.passive())],
      ['Words remaining to goal', num(Math.max(0, State.settings.totalGoal - Stats.total()))]
    ].map(([k, v]) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
  </div>`;
};

/* ---------- DATA MUTATIONS ---------- */
async function saveWord(w, quiet = false) {
  w.updatedAt = Date.now();
  const i = State.words.findIndex(x => x.id === w.id);
  if (i >= 0) State.words[i] = w; else State.words.push(w);
  await DB.put('words', w);
  buildIndexes();
  if (!quiet) { /* caller re-renders */ }
}
async function hardDeleteWord(id) {
  State.words = State.words.filter(w => w.id !== id);
  await DB.del('words', id);
  buildIndexes();
  render(); renderNav();
}
async function addWordQuick(word, date, opts = {}) {
  const lower = word.toLowerCase();
  if (liveWords().some(w => w.wordLower === lower)) {
    if (!opts.silent) toast(`"${word}" already exists`, 'warn');
    return 'dupe';
  }
  let data = {};
  if (opts.fetch !== false && State.settings.autoFetch && navigator.onLine) {
    const d = await fetchDictionary(word);
    if (d) data = d;
  }
  const w = {
    id: uid(), word, wordLower: lower,
    pos: data.pos || '',
    level: opts.level || State.settings.defaultLevel,
    meanings: data.meanings || [],
    example: data.example || '',
    commonUses: [], collocations: [],
    synonyms: data.synonyms || [], antonyms: data.antonyms || [],
    ipa: data.ipa || '', simplePron: '',
    forms: [], categories: opts.category ? [opts.category] : [],
    mySentence: '', notes: '',
    difficulty: 'Medium', confidence: 3,
    active: false, passive: true, statusLocked: false, status: 'New',
    dateAdded: date, createdAt: Date.now(), updatedAt: Date.now(),
    srs: { step: 0, nextReview: addDays(date, 1), last: null },
    history: [], failCount: 0, isDemo: false
  };
  await saveWord(w, true);
  if (!opts.silent) {
    const enriched = data.meanings && data.meanings.length;
    toast(enriched ? `"${word}" added with definition` : `"${word}" added`, 'ok');
    render(); renderNav();
  }
  return 'ok';
}
async function markSkipped(date, skipped) {
  const d = getDay(date);
  d.skipped = skipped;
  d.skippedAt = skipped ? Date.now() : null;
  State.days[date] = d;
  await DB.put('days', d);
  buildIndexes();
  toast(skipped ? `${shortDate(date)} marked as skipped` : `${shortDate(date)} restored`, 'ok');
  render(); renderNav();
}
async function applyReview(w, rating) {
  const today = todayISO();
  const intervals = State.settings.srsIntervals;
  let step = w.srs?.step ?? 0;
  if (rating === 'again') { step = 0; w.failCount = (w.failCount || 0) + 1; }
  else if (rating === 'hard') { step = Math.max(0, step - 1); w.failCount = (w.failCount || 0) + 1; }
  else if (rating === 'good') { step = Math.min(step + 1, intervals.length - 1); }
  else if (rating === 'easy') { step = Math.min(step + 2, intervals.length - 1); }
  const days = rating === 'again' ? 1 : intervals[Math.min(step, intervals.length - 1)];
  w.srs = { step, last: today, nextReview: addDays(today, days), lastRating: rating };
  w.history = w.history || [];
  w.history.push({ d: today, r: rating, t: Date.now() });
  if (rating === 'again') w.confidence = Math.max(1, (w.confidence || 3) - 1);
  else if (rating === 'easy') w.confidence = Math.min(5, (w.confidence || 3) + 1);
  else if (rating === 'good' && step >= 3) w.confidence = Math.min(5, (w.confidence || 3) + 1);
  await saveWord(w, true);
}

/* ---------- IMPORT / EXPORT ---------- */
function downloadFile(name, content, type = 'application/json') {
  try {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
    toast('File downloaded', 'ok');
  } catch (e) { toast('Download failed', 'bad'); }
}
function exportBackup() {
  const payload = {
    meta: { app: 'SandVoc', version: 1, exportedAt: new Date().toISOString(),
      counts: { words: State.words.length, quizzes: State.quizzes.length } },
    settings: State.settings, words: State.words,
    days: Object.values(State.days), quizzes: State.quizzes,
    customCategories: State.customCategories
  };
  downloadFile(`sandvoc-backup-${todayISO()}.json`, JSON.stringify(payload, null, 2));
}
function exportCSV() {
  const cols = ['word', 'pos', 'level', 'meanings', 'example', 'commonUses', 'collocations',
    'synonyms', 'antonyms', 'ipa', 'forms', 'categories', 'mySentence', 'notes',
    'difficulty', 'status', 'confidence', 'dateAdded', 'reviews', 'failCount', 'nextReview'];
  const rows = [cols.join(',')];
  for (const w of liveWords()) {
    rows.push([
      w.word, w.pos, w.level, (w.meanings || []).join(' | '),
      w.example, (w.commonUses || []).join(' | '), (w.collocations || []).join(' | '),
      (w.synonyms || []).join(' | '), (w.antonyms || []).join(' | '),
      w.ipa, (w.forms || []).join(' | '), (w.categories || []).join(' | '),
      w.mySentence, w.notes, w.difficulty, statusOf(w), w.confidence,
      w.dateAdded, (w.history || []).length, w.failCount || 0, w.srs?.nextReview || ''
    ].map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','));
  }
  downloadFile(`sandvoc-vocabulary-${todayISO()}.csv`, rows.join('\n'), 'text/csv');
}
document.addEventListener('DOMContentLoaded', () => {
  $('#fileIn').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    e.target.value = '';
    handleImport(text, file.name);
  });
});
function handleImport(text) {
  const trimmed = text.trim();
  let parsed = null;
  if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
    try { parsed = JSON.parse(trimmed); } catch { toast('Invalid JSON file', 'bad'); return; }
  }
  if (parsed) {
    if (Array.isArray(parsed)) { importWords(parsed); return; }
    if (parsed.words) { openImportBackupDialog(parsed); return; }
    toast('Unrecognised JSON structure', 'bad');
    return;
  }
  const firstLine = trimmed.split('\n')[0].toLowerCase();
  if (firstLine.includes(',') && (firstLine.includes('word') || firstLine.includes('level'))) {
    importCSV(trimmed);
    return;
  }
  const words = trimmed.split(/\r?\n/).flatMap(l => l.split(/[,;]+/)).map(s => s.trim()).filter(Boolean);
  if (!words.length) { toast('Nothing to import', 'bad'); return; }
  importWords(words.map(w => ({ word: w })));
}
function openImportBackupDialog(payload) {
  const n = (payload.words || []).length;
  openModal({
    title: 'Restore full backup', small: true,
    body: `<p style="font-size:14px;line-height:1.7;color:var(--tx2)">
      This backup contains <b>${n}</b> words, exported
      ${payload.meta?.exportedAt ? new Date(payload.meta.exportedAt).toLocaleString() : 'unknown date'}.</p>
      <p style="font-size:13.5px;line-height:1.7;color:var(--tx2);margin-top:10px">
      <b>Merge</b> keeps both devices' words (newer version wins on duplicates).<br>
      <b>Replace</b> deletes everything on this device first.</p>`,
    footer: `<button class="btn ghost" data-close>Cancel</button>
             <button class="btn ghost" id="bMerge">Merge</button>
             <button class="btn bad" id="bReplace">Replace all</button>`,
    onMount(el, close) {
      $('#bMerge', el).onclick = async () => { close(); await restoreBackup(payload, false); };
      $('#bReplace', el).onclick = async () => { close(); await restoreBackup(payload, true); };
    }
  });
}
async function restoreBackup(payload, replace) {
  try {
    if (replace) {
      await DB.clear('words'); await DB.clear('days');
      State.words = []; State.days = {};
    }
    const byLower = new Map(liveWords().map(w => [w.wordLower, w]));
    let added = 0, updated = 0;
    for (const raw of (payload.words || [])) {
      if (!raw || !raw.word) continue;
      const w = normalizeWordRecord(raw);
      const ex = byLower.get(w.wordLower);
      if (ex) {
        if ((w.updatedAt || 0) > (ex.updatedAt || 0)) {
          w.id = ex.id;
          w.history = mergeHistory(ex.history, w.history);
          const i = State.words.findIndex(x => x.id === ex.id);
          State.words[i] = w;
          await DB.put('words', w);
          updated++;
        }
      } else {
        State.words.push(w);
        await DB.put('words', w);
        added++;
      }
    }
    for (const d of (payload.days || [])) {
      if (!d || !d.date) continue;
      State.days[d.date] = d;
      await DB.put('days', d);
    }
    if (payload.settings) {
      State.settings = { ...DEFAULT_SETTINGS, ...payload.settings };
      await saveSettings();
    }
    if (payload.quizzes) {
      const ids = new Set(State.quizzes.map(q => q.id));
      for (const q of payload.quizzes) if (!ids.has(q.id)) State.quizzes.push(q);
      await DB.bulkPut('quizzes', State.quizzes);
    }
    if (payload.customCategories) {
      State.customCategories = [...new Set([...State.customCategories, ...payload.customCategories])];
      await DB.put('meta', { key: 'customCategories', value: State.customCategories });
    }
    buildIndexes(); applyTheme(); applyFont();
    render(); renderNav();
    toast(`Restore complete — ${added} added, ${updated} updated`, 'ok', 3600);
  } catch (e) {
    console.error(e);
    toast('Restore failed — file may be malformed', 'bad');
  }
}
function mergeHistory(a = [], b = []) {
  const map = new Map();
  [...a, ...b].forEach(h => { if (h && h.d) map.set(h.d + '|' + h.t, h); });
  return [...map.values()].sort((x, y) => (x.t || 0) - (y.t || 0));
}
function normalizeWordRecord(raw) {
  const word = String(raw.word || '').trim();
  return {
    id: raw.id || uid(), word, wordLower: word.toLowerCase(),
    pos: raw.pos || '',
    level: LEVELS.includes(raw.level) ? raw.level : 'B1',
    meanings: splitList(raw.meanings),
    example: raw.example || '',
    commonUses: splitList(raw.commonUses),
    collocations: splitList(raw.collocations),
    synonyms: splitList(raw.synonyms),
    antonyms: splitList(raw.antonyms),
    ipa: raw.ipa || '', simplePron: raw.simplePron || '',
    forms: splitList(raw.forms), categories: splitList(raw.categories),
    mySentence: raw.mySentence || '', notes: raw.notes || '',
    difficulty: DIFFICULTIES.includes(raw.difficulty) ? raw.difficulty : 'Medium',
    confidence: clamp(Number(raw.confidence) || 3, 1, 5),
    active: !!raw.active, passive: raw.passive !== false,
    statusLocked: !!raw.statusLocked, status: raw.status || 'New',
    dateAdded: raw.dateAdded || todayISO(),
    createdAt: raw.createdAt || Date.now(), updatedAt: raw.updatedAt || Date.now(),
    srs: raw.srs || { step: 0, nextReview: addDays(raw.dateAdded || todayISO(), 1), last: null },
    history: Array.isArray(raw.history) ? raw.history : [],
    failCount: Number(raw.failCount) || 0, isDemo: !!raw.isDemo
  };
}
function importCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) { toast('CSV appears empty', 'bad'); return; }
  const parseLine = line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (c === ',' && !q) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out.map(s => s.trim());
  };
  const header = parseLine(lines[0]).map(h => h.toLowerCase().replace(/\s+/g, ''));
  const idx = name => header.indexOf(name);
  const get = (row, name) => { const i = idx(name); return i >= 0 ? (row[i] || '') : ''; };
  const recs = [];
  for (let i = 1; i < lines.length; i++) {
    const row = parseLine(lines[i]);
    const w = get(row, 'word');
    if (!w) continue;
    recs.push({
      word: w, pos: get(row, 'pos'), level: get(row, 'level'),
      meanings: get(row, 'meanings') || get(row, 'meaning'),
      example: get(row, 'example'), commonUses: get(row, 'commonuses'),
      collocations: get(row, 'collocations'), synonyms: get(row, 'synonyms'),
      antonyms: get(row, 'antonyms'), ipa: get(row, 'ipa'), forms: get(row, 'forms'),
      categories: get(row, 'categories'), mySentence: get(row, 'mysentence'),
      notes: get(row, 'notes'), difficulty: get(row, 'difficulty'),
      dateAdded: get(row, 'dateadded') || todayISO()
    });
  }
  importWords(recs);
}
async function importWords(recs) {
  const list = recs.map(r => typeof r === 'string' ? { word: r } : r).filter(r => r && r.word);
  if (!list.length) { toast('No valid words found', 'bad'); return; }
  const existing = new Map(liveWords().map(w => [w.wordLower, w]));
  const dupes = list.filter(r => existing.has(String(r.word).toLowerCase()));
  const fresh = list.filter(r => !existing.has(String(r.word).toLowerCase()));
  const doImport = async strategy => {
    let added = 0, merged = 0, skipped = 0;
    for (const r of fresh) { await saveWord(normalizeWordRecord(r), true); added++; }
    for (const r of dupes) {
      const ex = existing.get(String(r.word).toLowerCase());
      if (strategy === 'ignore') { skipped++; continue; }
      if (strategy === 'replace') {
        const w = { ...normalizeWordRecord(r), id: ex.id, history: ex.history, srs: ex.srs, createdAt: ex.createdAt };
        await saveWord(w, true); merged++;
      } else {
        const w = { ...ex, ...normalizeWordRecord(r), id: ex.id, history: ex.history, srs: ex.srs, createdAt: ex.createdAt };
        w.meanings = [...new Set([...(ex.meanings || []), ...w.meanings])];
        w.collocations = [...new Set([...(ex.collocations || []), ...w.collocations])];
        w.categories = [...new Set([...(ex.categories || []), ...w.categories])];
        await saveWord(w, true); merged++;
      }
    }
    buildIndexes(); render(); renderNav();
    toast(`Import complete — ${added} new, ${merged} merged, ${skipped} skipped`, 'ok', 3600);
  };
  if (dupes.length) {
    openModal({
      title: 'Duplicates found', small: true,
      body: `<p style="font-size:14px;line-height:1.7;color:var(--tx2)">
        ${fresh.length} new word${fresh.length === 1 ? '' : 's'} will be added.<br>
        ${dupes.length} word${dupes.length === 1 ? '' : 's'} already exist.</p>`,
      footer: `<button class="btn ghost" id="iIgnore">Ignore dupes</button>
               <button class="btn ghost" id="iMerge">Merge</button>
               <button class="btn" id="iReplace">Replace</button>`,
      onMount(el, close) {
        $('#iIgnore', el).onclick = () => { close(); doImport('ignore'); };
        $('#iMerge', el).onclick = () => { close(); doImport('merge'); };
        $('#iReplace', el).onclick = () => { close(); doImport('replace'); };
      }
    });
  } else doImport('ignore');
}

const applyTheme = () => { document.documentElement.dataset.theme = State.settings.theme || 'dark'; };
const applyFont = () => { document.documentElement.style.setProperty('--fs', (State.settings.fontSize || 15) + 'px'); };
function allCategories() {
  const set = new Set(BASE_CATEGORIES);
  State.customCategories.forEach(c => set.add(c));
  liveWords().forEach(w => (w.categories || []).forEach(c => set.add(c)));
  return [...set].sort();
}

async function loadDemoData() {
  const existing = new Set(liveWords().map(w => w.wordLower));
  let n = 0;
  for (let i = 0; i < DEMO_WORDS.length; i++) {
    const d = DEMO_WORDS[i];
    if (existing.has(d.word.toLowerCase())) continue;
    const date = addDays(todayISO(), -i);
    const w = normalizeWordRecord({
      ...d, id: uid(), dateAdded: date,
      createdAt: Date.now() - i * 1000, updatedAt: Date.now() - i * 1000,
      confidence: 3, srs: { step: 0, nextReview: addDays(date, 1), last: null },
      history: [], isDemo: true
    });
    w.isDemo = true;
    await saveWord(w, true);
    n++;
  }
  State.settings.demoLoaded = true;
  await saveSettings();
  buildIndexes(); render(); renderNav();
  toast(n ? `${n} demo words loaded` : 'Demo words already present', n ? 'ok' : 'warn');
}
async function removeDemoData() {
  const demos = State.words.filter(w => w.isDemo);
  for (const w of demos) await DB.del('words', w.id);
  State.words = State.words.filter(w => !w.isDemo);
  State.settings.demoLoaded = false;
  await saveSettings();
  buildIndexes(); render(); renderNav();
}

/* ---------- BOOTSTRAP ---------- */
async function loadAll() {
  await DB.init();
  State.words = (await DB.getAll('words')).filter(w => w && w.id);
  const days = await DB.getAll('days');
  State.days = {};
  days.forEach(d => { if (d && d.date) State.days[d.date] = d; });
  const meta = await DB.getAll('meta');
  const settingsRec = meta.find(m => m.key === 'settings');
  if (settingsRec?.value) State.settings = { ...DEFAULT_SETTINGS, ...settingsRec.value };
  const catRec = meta.find(m => m.key === 'customCategories');
  if (catRec && Array.isArray(catRec.value)) State.customCategories = catRec.value;
  State.quizzes = (await DB.getAll('quizzes')).filter(q => q && q.id);
  if (!State.settings.programStart) State.settings.programStart = todayISO();
  if (!State.settings.deviceName) {
    State.settings.deviceName = /Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Phone' : 'Laptop';
  }
  buildIndexes(); applyTheme(); applyFont();
}

  const root = $('#viewRoot');
